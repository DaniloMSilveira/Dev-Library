# Projeto Desenvolvido na Data Science Academy
[project]
name = "ecommerce-ai-backend"
version = "1.0.0"
description = "E-commerce com Atendimento Automatizado via Agentes de IA e RAG"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
